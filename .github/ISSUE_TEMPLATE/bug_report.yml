name: Bug report
description: Report a problem with Molerat 🐀
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: How can we reproduce it?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
  - type: input
    id: version
    attributes:
      label: Molerat version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
